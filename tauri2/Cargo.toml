[workspace]
resolver = "2"
members = [
  "crates/dla-connector",
  "crates/dla-remote",
  "crates/dla-library",
  "crates/dla-app-update",
  "src-tauri",
]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.85.0"
authors = ["DLA Project"]
publish = false

[workspace.dependencies]
dla-connector = { path = "crates/dla-connector" }
dla-remote = { path = "crates/dla-remote" }
dla-library = { path = "crates/dla-library" }
dla-app-update = { path = "crates/dla-app-update" }
base64 = "=0.22.1"
getrandom = "=0.3.4"
hex = "=0.4.3"
libc = "=0.2.189"
# The verifier tauri-plugin-updater uses, for the signatures `cargo tauri build` makes.
minisign-verify = "=0.2.5"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
